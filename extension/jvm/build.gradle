// Desktop JVM (Linux / macOS / Windows) artifact for ExecuTorch.
//
// Thin sibling of :executorch_android: all platform-neutral API classes come from
// :executorch_java. This module only adds the desktop-specific pieces:
//   - ExecuTorchJvm.init(): installs the classpath-extracting native loader
//   - JvmNativeLoaderDelegate / NativeLibraryLoader: per-OS native library delivery
//   - Per-platform native jars published with Maven classifiers
//     (executorch-jvm-<version>-linux-x86_64.jar, -macos-aarch64.jar, ...)

apply plugin: 'kotlin'
apply plugin: 'java-library'
apply plugin: 'com.vanniktech.maven.publish'
apply plugin: 'com.diffplug.spotless'

spotless {
    kotlin {
        target '**/*.kt'
        ktfmt()
    }
}

def execuTorchVersion = System.properties['execuTorchVersion']

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    api project(':executorch_java')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.23"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-core:3.27.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:1.9.23'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-Xjvm-default=all"]
    }
}

// ---------------------------------------------------------------------------
// Per-platform native jars.
//
// CI builds the JNI library for each desktop OS/arch with CMake
// (extension/android/CMakeLists.txt, non-Android branch) and stages the binary as
//   extension/cmake-out-jvm/<classifier>/libexecutorch_jni.{so,dylib}  (or executorch_jni.dll)
// where <classifier> is e.g. linux-x86_64. Each staged binary is packaged as
// executorch-jvm-<version>-<classifier>.jar containing
//   native/<os>/<arch>/<library-file>
// which NativeLibraryLoader extracts and loads at runtime. Classifiers whose
// staging directory does not exist are skipped, so local builds publish the API
// jar only.
// ---------------------------------------------------------------------------
def nativeClassifiers = [
    'linux-x86_64', 'linux-aarch64',
    'macos-x86_64', 'macos-aarch64',
    'windows-x86_64', 'windows-aarch64',
]

def nativeJarTasks = []
nativeClassifiers.each { classifier ->
    def parts = classifier.split('-')
    def osDir = parts[0]
    def archDir = parts[1]
    def taskName = 'jarNative' + classifier.split('-').collect { it.capitalize() }.join('')
    def stagingDir = rootProject.file("../cmake-out-jvm/${classifier}")
    def t = tasks.register(taskName, Jar) {
        archiveClassifier.set(classifier)
        destinationDirectory.set(layout.buildDirectory.dir("libs"))
        from(stagingDir) {
            into "native/${osDir}/${archDir}"
        }
        onlyIf { stagingDir.exists() }
    }
    nativeJarTasks.add([task: t, dir: stagingDir])
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    coordinates("org.pytorch", "executorch-jvm", execuTorchVersion ? execuTorchVersion : "1.2.0-SNAPSHOT")

    pom {
        name = "ExecuTorch JVM"
        description = "ExecuTorch Java/Kotlin bindings for standard desktop JVM (Linux, macOS, Windows)"
        inceptionYear = "2024"
        url = "https://github.com/pytorch/executorch/"
        licenses {
            license {
                name = "BSD 3-Clause"
                url = "https://github.com/pytorch/executorch/blob/main/LICENSE"
                distribution = "https://github.com/pytorch/executorch/blob/main/LICENSE"
            }
        }
        developers {
            developer {
                id = "pytorch"
                name = "pytorch"
                url = "https://github.com/pytorch/executorch/"
            }
        }
        scm {
            url = "https://github.com/pytorch/executorch.git"
            connection = "scm:git:git@github.com:pytorch/executorch.git"
            developerConnection = "scm:git:git@github.com:pytorch/executorch.git"
        }
    }
}

// Attach each staged per-platform native jar to the Maven publication as a
// classified artifact. Evaluated after the maven-publish plugin creates the
// publication; unstaged platforms are omitted entirely.
afterEvaluate {
    publishing {
        publications.withType(MavenPublication).configureEach { pub ->
            nativeJarTasks.each { entry ->
                if (entry.dir.exists()) {
                    pub.artifact(entry.task.get())
                }
            }
        }
    }
}
