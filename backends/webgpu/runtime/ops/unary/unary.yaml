unary:
  parameter_names_with_default_values:
    OPERATOR: "abs(x)"
  shader_variants:
    - NAME: abs
    - NAME: cos
      OPERATOR: "cos(x)"
    - NAME: exp
      OPERATOR: "exp(x)"
    - NAME: hardswish
      OPERATOR: "select(select(x * (x + 3.0) / 6.0, x, x >= 3.0), 0.0, x <= -3.0)"
    - NAME: neg
      OPERATOR: "-x"
    - NAME: round
      OPERATOR: "round(x)"
    - NAME: rsqrt
      OPERATOR: "1.0 / sqrt(x)"
    - NAME: silu
      # x * sigmoid(x) with exp of -|x| only, so exp never overflows and
      # silu(-inf) = -inf * 0 = NaN as in PyTorch.
      OPERATOR: "x * select(1.0, exp(-abs(x)), x < 0.0) / (1.0 + exp(-abs(x)))"
    - NAME: sin
      OPERATOR: "sin(x)"
    - NAME: sqrt
      OPERATOR: "sqrt(x)"
    - NAME: tanh
      OPERATOR: "tanh(clamp(x, -15.0, 15.0))"
