solution:
  created-for: CMSIS-Toolbox@2.14.1
  cdefault:
  compiler: GCC@14.3.1

  packs:
    - pack: ARM::CMSIS@>=6.0.0
    - pack: ARM::Cortex_DFP@>=1.1.0
    - pack: ARM::SSE_315_BSP@>=1.0.0
    - pack: ARM::SSE_320_BSP@>=1.0.0
      for-context: +SSE-320
    - pack: ARM::CMSIS-NN
    - pack: ARM::CMSIS-Compiler
    - pack: ARM::ethos-u-core-driver@>=1.25.2
      for-context: +SSE-320
    - pack: PyTorch::ExecuTorch

  target-types:
    # Corstone-315 (Cortex-M85 host, no NPU): every non-delegated op runs here.
    - type: SSE-315
      device: ARM::SSE-315-FVP
    # Corstone-320 (Cortex-M85 host + Ethos-U85 NPU): the delegated variant.
    # Every op is exported through Vela; whatever partitions runs on the NPU,
    # the rest falls back to the host core. Selected by ETHOS_U=1 in run.sh.
    - type: SSE-320
      device: ARM::SSE-320-FVP

  build-types:
    - type: Debug
      debug: on
      optimize: debug

  projects:
    # Generated by gen_cproject.py (run.sh regenerates it before cbuild).
    - project: ./all_ops.cproject.yml
