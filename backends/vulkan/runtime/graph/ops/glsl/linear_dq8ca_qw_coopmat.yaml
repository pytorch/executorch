# coopmat<int8> x coopmat<int8> -> coopmat<int32> variant of the
# dynamically-quantized-activation linear tiled shader (INT4 group-symmetric
# weight).
#   WEIGHT_NBITS=4 -> linear_dq8ca_q4gsw_coopmat (INT4 group-symmetric)
# Requires the exact signed-int8 multiply and accumulator matrix types used by
# the selected subgroup variant.
# Loop structure follows the double-buffered reference (coopmat_mm_ref) at
# a 128x64 tile with K-step 32 and 256 threads. Devices with a native subgroup
# size of 64 use four 16x16x16 MMAs; devices with a native subgroup size of 32
# use eight 16x16x32 MMAs.

linear_dq8ca_qw_coopmat:
  parameter_names_with_default_values:
    PRECISION: highp
    HAS_BIAS: false
    WEIGHT_NBITS: 4
    WEIGHT_STORAGE: texture2d
    MMA_M: 16
    MMA_N: 16
    MMA_K: 16
    WG_TILE_M: 128
    WG_TILE_N: 64
    WG_TILE_K: 32
    SG_GRID_X: 2
    SG_GRID_Y: 2
    SUBGROUP_SIZE: 64
  shader_variants:
    - NAME: linear_dq8ca_q4gsw_coopmat_buffer_texture2d_half
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
    - NAME: linear_dq8ca_q4gsw_coopmat_buffer_buffer_half
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: buffer
    - NAME: linear_dq8ca_q4gsw_coopmat_sg32_buffer_texture2d_half
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
      MMA_K: 32
      SG_GRID_X: 4
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
    - NAME: linear_dq8ca_q4gsw_coopmat_sg32_buffer_buffer_half
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: buffer
      MMA_K: 32
      SG_GRID_X: 4
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
