conv2d_pw_tiled:
  parameter_names_with_default_values:
    DTYPE: float
    STORAGE: texture3d
    WEIGHT_STORAGE: texture2d
    TILE_M4: 1
    TILE_K4: 1
    TILE_N4: 1
    TILE_M: 2
    TILE_H: 1
    PIXEL_TILES_ON_X: false
  generate_variant_forall:
    DTYPE:
      - VALUE: float
      - VALUE: half
  shader_variants:
    - NAME: conv2d_pw_tiled
    - NAME: conv2d_pw_tiled_bufw
      WEIGHT_STORAGE: buffer
    - NAME: conv2d_pw_tiled_4x8
      TILE_M: 4
      TILE_H: 2
      TILE_N4: 2
      PIXEL_TILES_ON_X: true
    - NAME: conv2d_pw_tiled_4x8_bufw
      TILE_M: 4
      TILE_H: 2
      TILE_N4: 2
      WEIGHT_STORAGE: buffer
      PIXEL_TILES_ON_X: true
