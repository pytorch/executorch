binary_scalar:
  parameter_names_with_default_values:
    OPERATOR: power_of(X, Y)
    IS_COMPARISON_OP: false
    DTYPE: float
    SCALAR_VALUE_TYPE: float
    STORAGE: texture3d
  generate_variant_forall:
    STORAGE:
      - VALUE: buffer
      - VALUE: texture3d
    combination:
      parameter_names: [DTYPE, SCALAR_VALUE_TYPE]
      combos:
       - parameter_values: [half, float]
       - parameter_values: [float, float]
       - parameter_values: [int32, int32]
       - parameter_values: [int32, float]
  shader_variants:
    - NAME: pow_scalar
    - NAME: mul_scalar
      OPERATOR: X * Y
    - NAME: eq_scalar
      OPERATOR: equal(X, Y)
      IS_COMPARISON_OP: true
    - NAME: ne_scalar
      OPERATOR: notEqual(X, Y)
      IS_COMPARISON_OP: true
    - NAME: lt_scalar
      OPERATOR: lessThan(X, Y)
      IS_COMPARISON_OP: true
    - NAME: le_scalar
      OPERATOR: lessThanEqual(X, Y)
      IS_COMPARISON_OP: true
    - NAME: gt_scalar
      OPERATOR: greaterThan(X, Y)
      IS_COMPARISON_OP: true
    - NAME: ge_scalar
      OPERATOR: greaterThanEqual(X, Y)
      IS_COMPARISON_OP: true
