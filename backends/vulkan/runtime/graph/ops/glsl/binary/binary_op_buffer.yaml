# The op is selected at dispatch through the op_type specialization constant.
binary_op_buffer:
  parameter_names_with_default_values:
    NDIM: 3
    DTYPE: float
    PACKING: C_packed
    STORAGE: buffer
    IS_COMPARISON_OP: 0
  shader_variants:
    # Bitwise ops only exist for uint8; uint8 has no arithmetic ops.
    - NAME: binary_op_buffer
      generate_variant_forall:
        DTYPE:
          - VALUE: half
          - VALUE: float
          - VALUE: int32
          - VALUE: uint8
    - NAME: binary_cmp_buffer
      IS_COMPARISON_OP: 1
      generate_variant_forall:
        DTYPE:
          - VALUE: half
          - VALUE: float
          - VALUE: int32
