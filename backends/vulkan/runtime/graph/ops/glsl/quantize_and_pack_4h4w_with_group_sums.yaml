quantize_and_pack_4h4w_with_group_sums:
  parameter_names_with_default_values:
    DTYPE: float
    OUTPUT_STORAGE: buffer
    INPUT_STORAGE: texture3d
    NUM_GROUPS_PER_WG: 2
    NUM_WORKERS_PER_GROUP: 32
    ZP_DTYPE_MODE: zpint8
    OUTPUT_LAYOUT: 4h4w
  generate_variant_forall:
    DTYPE:
      - VALUE: half
      - VALUE: float
    ZP_DTYPE_MODE:
      - VALUE: zpint8
      - VALUE: zpinherit
  shader_variants:
    - NAME: quantize_and_pack_4h4w_with_group_sums_o2w32_buffer_texture3d
    - NAME: quantize_and_pack_4h4w_with_group_sums_o2w32_buffer_buffer
      OUTPUT_STORAGE: buffer
      INPUT_STORAGE: buffer
    - NAME: quantize_and_pack_4h4w_with_group_sums_o4w16_buffer_texture3d
      NUM_GROUPS_PER_WG: 4
      NUM_WORKERS_PER_GROUP: 16
    - NAME: quantize_and_pack_4h4w_with_group_sums_o4w16_buffer_buffer
      NUM_GROUPS_PER_WG: 4
      NUM_WORKERS_PER_GROUP: 16
      OUTPUT_STORAGE: buffer
      INPUT_STORAGE: buffer
    # Row-major output (kPackedInt8_4W) for the ROWMAJOR_A linear_dq8ca_q4gsw_wmma
    # variants.
    - NAME: quantize_and_pack_4w_with_group_sums_o2w32_buffer_texture3d
      OUTPUT_LAYOUT: 4w
    - NAME: quantize_and_pack_4w_with_group_sums_o4w16_buffer_texture3d
      NUM_GROUPS_PER_WG: 4
      NUM_WORKERS_PER_GROUP: 16
      OUTPUT_LAYOUT: 4w
