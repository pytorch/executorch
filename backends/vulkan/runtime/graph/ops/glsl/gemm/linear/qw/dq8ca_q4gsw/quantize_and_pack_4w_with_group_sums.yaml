# Row-major (utils::kPackedInt8_4W) counterpart of
# quantize_and_pack_4h4w_with_group_sums: same quantization, per-group sum
# reduction and workgroup shapes (_o2w32 / _o4w16); only the output layout
# differs. Consumed by linear_dq8ca_q4gsw_wmma_rowmajor, whose cooperative
# matrix A staging needs row-major int8 activations. Buffer output only.

quantize_and_pack_4w_with_group_sums:
  parameter_names_with_default_values:
    DTYPE: float
    OUTPUT_STORAGE: buffer
    INPUT_STORAGE: texture3d
    NUM_GROUPS_PER_WG: 2
    NUM_WORKERS_PER_GROUP: 32
    ZP_DTYPE_MODE: zpint8
  generate_variant_forall:
    DTYPE:
      - VALUE: half
      - VALUE: float
    ZP_DTYPE_MODE:
      - VALUE: zpint8
      - VALUE: zpinherit
  shader_variants:
    - NAME: quantize_and_pack_4w_with_group_sums_o2w32_buffer_texture3d
    - NAME: quantize_and_pack_4w_with_group_sums_o4w16_buffer_texture3d
      NUM_GROUPS_PER_WG: 4
      NUM_WORKERS_PER_GROUP: 16
