scalar_tensor:
  parameter_names_with_default_values:
    NDIM: 3
    DTYPE: float
    SCALAR_VALUE_TYPE: float
    PACKING: C_packed
    STORAGE: texture3d
  generate_variant_forall:
    combination:
      parameter_names: [DTYPE, STORAGE, SCALAR_VALUE_TYPE]
      combos:
        - parameter_values: [half, texture3d, float]
        - parameter_values: [half, buffer, float]
        - parameter_values: [float, texture3d, float]
        - parameter_values: [float, buffer, float]
        - parameter_values: [int32, texture3d, int32]
        - parameter_values: [int32, buffer, int32]
  shader_variants:
    - NAME: scalar_tensor
