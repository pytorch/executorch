[build-system]
requires = ["scikit-build-core>=0.11", "pyyaml", "zstd", "certifi"]
build-backend = "scikit_build_core.build"

[project]
name = "executorch-native"
dynamic = ["version"]
description = "ExecuTorch Native C++ SDK with Vulkan and GGML engines"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"

[tool.scikit-build]
cmake.version = ">=3.26,<4"
build.targets = ["executorch_native_sdk"]
install.components = ["executorch_native"]
wheel.install-dir = "executorch_native"
wheel.packages = []
wheel.py-api = "py3"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "../../../version.txt"
regex = "(?P<value>[^\\s]+)"
