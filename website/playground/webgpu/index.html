<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebGPU · ExecuTorch Playground</title>

  <script>
    // Resolve the theme before first paint so dark-mode visitors never see a light flash.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('etwg-theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="./styles/app.css">
  <link rel="stylesheet" href="./styles/vision.css">
  <link rel="stylesheet" href="./styles/stt.css">
  <link rel="stylesheet" href="./styles/vlm.css">
  <link rel="stylesheet" href="./styles/segment.css">
  <link rel="stylesheet" href="./styles/effects.css">
</head>
<body>
  <header class="sitebar">
    <div class="sitebar__inner">
      <a class="sitebar__brand" href="../../index.html">
        <img class="sitebar__logo" src="./assets/executorch-chip-logo.svg" alt="" width="40" height="40">
        <span class="sitebar__name">ExecuTorch</span>
      </a>
      <nav class="sitebar__links" aria-label="executorch.ai">

      <form class="sitebar__search" action="https://docs.pytorch.org/executorch/1.0/search.html" method="get">
        <input class="sitebar__search-input" type="text" name="q" placeholder="Search docs…" aria-label="Search docs">
      </form>
    </div>
  </header>
  <div id="app" class="app">
    <noscript><p class="noscript">This playground needs JavaScript to run demos on your GPU.</p></noscript>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
