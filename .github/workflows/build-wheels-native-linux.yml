# From https://github.com/pytorch/test-infra/wiki/Using-Nova-Reusable-Build-Workflows
name: Build Linux Native Wheels

on:
  pull_request:
    paths:
      - .ci/**/*
      - .github/workflows/build-wheels-native-linux.yml
      - '**/CMakeLists.txt'
      - backends/native/**/*
      - backends/vulkan/**/*
      - backends/transforms/**/*
      - exir/**/*
      - schema/**/*
      - examples/**/*
      - version.txt
      - .gitmodules
      - pyproject.toml
      - setup.py
      - install_utils.py
      - tools/cmake/**/*
  push:
    branches:
      - nightly
      - release/*
    tags:
      # NOTE: Binary build pipelines should only get triggered on release candidate builds
      # Release candidate tags look like: v1.11.0-rc1
      - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+
      - ciflow/binaries/*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

jobs:
  generate-matrix:
    uses: pytorch/test-infra/.github/workflows/generate_binary_build_matrix.yml@main
    with:
      package-type: wheel
      os: linux
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      runner-fleet: osdc
      with-cuda: disabled
      with-rocm: disabled
      python-versions: '["3.11", "3.12", "3.13", "3.14", "3.15"]'

  build:
    needs: generate-matrix
    permissions:
      id-token: write
      contents: read
    name: executorch-native
    uses: pytorch/test-infra/.github/workflows/build_wheels_linux.yml@main
    with:
      repository: pytorch/executorch
      ref: ""
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      build-matrix: ${{ needs.generate-matrix.outputs.matrix }}
      submodules: recursive
      env-var-script: .ci/scripts/wheel/envvar_native.sh
      pre-script: ../../../.ci/scripts/wheel/pre_build_native.sh
      post-script: ../../../.ci/scripts/wheel/post_build_native.sh
      package-name: executorch-native
      # The post-build script installs the wheel in a clean environment and
      # tests it; Nova's smoke test requires a pinned torch dependency.
      run-smoke-test: false
      # Only "push" uploads; executorch-native is not published yet.
      trigger-event: development
