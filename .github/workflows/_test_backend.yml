name: Test Backend

on:
  workflow_call:
    inputs:
      backend:
        description: 'Backend to test (xnnpack, coreml, vulkan, qnn, openvino)'
        required: true
        type: string
      flows:
        description: 'JSON array of flows to test'
        required: true
        type: string
      exclude:
        description: 'JSON array of {flow, suite} pairs to drop from the matrix'
        required: false
        type: string
        default: '[]'
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ${{ github.sha }}
      timeout:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 120
      run-linux:
        description: 'Whether to run Linux tests'
        required: false
        type: boolean
        default: false
      run-macos:
        description: 'Whether to run macOS tests'
        required: false
        type: boolean
        default: false
      runner-linux:
        description: 'Runner type for Linux jobs'
        required: false
        type: string
        default: mt-l-x86iavx512-16-128
      docker-image:
        description: 'Name of the docker image to use, without registry or tag suffix'
        required: false
        type: string
        default: ci-image:executorch-ubuntu-22.04-clang12

jobs:
  docker-image:
    name: Resolve CI docker image
    if: ${{ inputs.run-linux }}
    uses: ./.github/workflows/_docker-image.yml

  test-backend-linux:
    needs: docker-image
    if: ${{ inputs.run-linux }}
    strategy:
      fail-fast: false
      matrix:
        flow: ${{ fromJSON(inputs.flows) }}
        suite: [models, operators]
        exclude: ${{ fromJSON(inputs.exclude) }}

    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      ref: ${{ inputs.ref }}
      runner: ${{ inputs.runner-linux }}
      docker-image: ${{ needs.docker-image.outputs.docker-registry }}/${{ inputs.docker-image }}-${{ needs.docker-image.outputs.ci-docker-hash }}
      submodules: recursive
      timeout: ${{ inputs.timeout }}
      upload-artifact: test-report-${{ inputs.backend }}-${{ matrix.flow }}-${{ matrix.suite }}
      upload-artifact-to-s3: true
      script: |
        set -eux

        # Namespace per matrix cell: S3 uploads share one run-level prefix.
        ARTIFACT_SUBDIR="${RUNNER_ARTIFACT_DIR}/test-report-${{ inputs.backend }}-${{ matrix.flow }}-${{ matrix.suite }}"
        mkdir -p "${ARTIFACT_SUBDIR}"
        source .ci/scripts/test_backend.sh "${{ matrix.suite }}" "${{ matrix.flow }}" "${ARTIFACT_SUBDIR}"

  package-golden-artifacts:
    if: ${{ inputs.run-linux }}
    needs: test-backend-linux
    runs-on: linux.2xlarge
    steps:
      - name: Download model test artifacts
        run: |
          set -eux
          aws s3 cp --recursive \
            "s3://gha-artifacts/${{ github.repository }}/${{ github.run_id }}/artifacts/" downloaded/ \
            --exclude "*" --include "test-report-${{ inputs.backend }}-*-models/*"

      - name: Package golden artifacts
        run: |
          set -eux
          TIMESTAMP=$(date -u +%y%m%d%H)
          mkdir -p golden_combined

          # Collect golden artifacts preserving flow directory structure.
          # Raw files live under downloaded/*/golden-artifacts/{flow}/.
          for flow_dir in downloaded/*/golden-artifacts/*/; do
            [ -d "$flow_dir" ] || continue
            flow_name=$(basename "$flow_dir")
            if ls "$flow_dir"/*.pte 1>/dev/null 2>&1; then
              mkdir -p "golden_combined/${flow_name}"
              cp "$flow_dir"/*.pte "$flow_dir"/*_input*.bin "$flow_dir"/*_expected_output*.bin \
                "golden_combined/${flow_name}/" 2>/dev/null || true
            fi
          done

          if find golden_combined -name '*.pte' | grep -q .; then
            (cd golden_combined && zip -r "../golden_artifacts_${TIMESTAMP}.zip" .)
            echo "Created golden_artifacts_${TIMESTAMP}.zip"
            find golden_combined -type f | head -20
          else
            echo "No golden artifacts found."
          fi

      - name: Upload golden artifacts to S3
        uses: seemethere/upload-artifact-s3@v5
        if: ${{ hashFiles('golden_artifacts_*.zip') != '' }}
        with:
          s3-bucket: gha-artifacts
          s3-prefix: |
            ${{ github.repository }}/test-backend-artifacts/golden-artifacts-${{ inputs.backend }}
          retention-days: 90
          if-no-files-found: ignore
          path: golden_artifacts_*.zip

  test-backend-macos:
    if: ${{ inputs.run-macos }}
    strategy:
      fail-fast: false
      matrix:
        flow: ${{ fromJSON(inputs.flows) }}
        suite: [models, operators]
        exclude: ${{ fromJSON(inputs.exclude) }}

    uses: pytorch/test-infra/.github/workflows/macos_job.yml@main
    with:
      default-packages: ""
      ref: ${{ inputs.ref }}
      runner: macos-m1-stable
      python-version: "3.12"
      submodules: recursive
      timeout: ${{ inputs.timeout }}
      upload-artifact: test-report-${{ inputs.backend }}-${{ matrix.flow }}-${{ matrix.suite }}
      upload-artifact-to-s3: true
      script: |
        set -eux

        # This is needed to get the prebuilt PyTorch wheel from S3
        ${CONDA_RUN} --no-capture-output pip install awscli==1.37.21

        # Namespace per matrix cell: S3 uploads share one run-level prefix.
        ARTIFACT_SUBDIR="${RUNNER_ARTIFACT_DIR}/test-report-${{ inputs.backend }}-${{ matrix.flow }}-${{ matrix.suite }}"
        mkdir -p "${ARTIFACT_SUBDIR}"
        source .ci/scripts/test_backend.sh "${{ matrix.suite }}" "${{ matrix.flow }}" "${ARTIFACT_SUBDIR}"
