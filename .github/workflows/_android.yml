name: Android

on:
  workflow_call:
    inputs:
      split-backends:
        description: Build XNNPACK and Vulkan as their own shared libraries
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      split-backends:
        description: Build XNNPACK and Vulkan as their own shared libraries
        type: boolean
        default: false

jobs:
  build-android:
    name: build-android
    runs-on: 16-core-ubuntu
    permissions:
      id-token: write
      contents: read
    env:
      PYTHON_EXECUTABLE: python3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install torch executorch

      - name: Set up Android NDK
        run: |
          # Use the pre-installed NDK from the GH runner
          ANDROID_NDK=$(ls -d "$ANDROID_HOME/ndk/"*/ 2>/dev/null | sort -V | tail -1)
          if [ -z "$ANDROID_NDK" ]; then
            echo "No Android NDK found at $ANDROID_HOME/ndk/"
            exit 1
          fi
          ANDROID_NDK="${ANDROID_NDK%/}"
          echo "Using Android NDK: $ANDROID_NDK"
          echo "ANDROID_NDK=$ANDROID_NDK" >> "$GITHUB_ENV"

      - name: Install Vulkan SDK
        if: ${{ inputs.split-backends }}
        run: |
          set -eux
          curl -fsSLO https://sdk.lunarg.com/sdk/download/1.4.321.1/linux/vulkansdk-linux-x86_64-1.4.321.1.tar.xz
          tar xf vulkansdk-linux-x86_64-1.4.321.1.tar.xz -C /tmp
          echo "/tmp/1.4.321.1/x86_64/bin" >> "$GITHUB_PATH"

      - name: Build Android library
        env:
          EXECUTORCH_BUILD_VULKAN: ${{ inputs.split-backends && 'ON' || 'OFF' }}
          EXECUTORCH_BUILD_VULKAN_BACKEND_SHARED: ${{ inputs.split-backends && 'ON' || 'OFF' }}
          EXECUTORCH_BUILD_XNNPACK_BACKEND_SHARED: ${{ inputs.split-backends && 'ON' || 'OFF' }}
        run: |
          set -eux
          export BUILD_AAR_DIR=aar-out
          mkdir -p $BUILD_AAR_DIR
          bash scripts/build_android_library.sh

      - name: Check split backend libraries
        if: ${{ inputs.split-backends }}
        run: |
          set -eux
          BIN=$(ls -d "$ANDROID_NDK"/toolchains/llvm/prebuilt/*/bin)
          for abi in arm64-v8a x86_64; do
            unzip -l aar-out/executorch.aar "jni/${abi}/libexecutorch.so"
            for backend in xnnpack vulkan; do
              unzip -l aar-out/executorch.aar "jni/${abi}/lib${backend}_executorch_backend.so"
              lib="cmake-out-android-so/${abi}/lib${backend}_executorch_backend.so"
              # The backend registers into the runtime's registry rather than a copy of its own.
              "$BIN/llvm-readelf" -d "$lib" | grep -F '[libexecutorch.so]'
              "$BIN/llvm-nm" -DC --undefined-only "$lib" | grep -F 'executorch::runtime::register_backend'
            done
          done

      - name: Build Android test APK
        run: |
          set -eux
          bash extension/android/executorch_android/android_test_setup.sh
          cd extension/android
          ANDROID_HOME="${ANDROID_HOME}" ./gradlew :executorch_android:assembleAndroidTest

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apps${{ inputs.split-backends && '-split-backends' || '' }}
          path: |
            aar-out/executorch.aar
            extension/android/executorch_android/build/outputs/apk/androidTest/debug/executorch_android-debug-androidTest.apk

  # Running Android emulator directly on the runner and not using Docker
  run-emulator:
    needs: build-android
    # NB: This job runs on the shared 8-core-ubuntu runner; KVM / bare-metal assumptions no longer apply
    runs-on: 8-core-ubuntu
    env:
      API_LEVEL: 34
    steps:
      - name: Setup SSH (Click me for login details)
        uses: pytorch/test-infra/.github/actions/setup-ssh@main
        with:
          github-secret: ${{ secrets.GITHUB_TOKEN }}
          instructions: |
            This is used to run Android emulators

      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apps${{ inputs.split-backends && '-split-backends' || '' }}

      - name: Prepare test APK
        run: |
          cp extension/android/executorch_android/build/outputs/apk/androidTest/debug/executorch_android-debug-androidTest.apk android-test-debug-androidTest.apk

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}

      # NB: It takes about 10m to cold boot the emulator here
      - name: Run Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          script: ./scripts/run_android_emulator.sh
          cores: 6
          ram-size: 16384M
          heap-size: 12288M
          force-avd-creation: false
          # The action's built-in animation disabling runs immediately after
          # boot and is not retried. Software-emulated boots can briefly drop
          # adb there, so scripts/run_android_emulator.sh handles it instead.
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          emulator-boot-timeout: 900
