name: Android

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-android:
    name: build-android
    runs-on: 16-core-ubuntu
    permissions:
      id-token: write
      contents: read
    env:
      PYTHON_EXECUTABLE: python3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install torch executorch

      - name: Set up Android NDK
        run: |
          # Use the pre-installed NDK from the GH runner
          ANDROID_NDK=$(ls -d "$ANDROID_HOME/ndk/"*/ 2>/dev/null | sort -V | tail -1)
          if [ -z "$ANDROID_NDK" ]; then
            echo "No Android NDK found at $ANDROID_HOME/ndk/"
            exit 1
          fi
          ANDROID_NDK="${ANDROID_NDK%/}"
          echo "Using Android NDK: $ANDROID_NDK"
          echo "ANDROID_NDK=$ANDROID_NDK" >> "$GITHUB_ENV"

      - name: Build Android library
        run: |
          set -eux
          export BUILD_AAR_DIR=aar-out
          mkdir -p $BUILD_AAR_DIR
          bash scripts/build_android_library.sh

      - name: Build Android test APK
        run: |
          set -eux
          bash extension/android/executorch_android/android_test_setup.sh
          cd extension/android
          ANDROID_HOME="${ANDROID_HOME}" ./gradlew :executorch_android:assembleAndroidTest

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apps
          path: |
            aar-out/executorch.aar
            extension/android/executorch_android/build/outputs/apk/androidTest/debug/executorch_android-debug-androidTest.apk

  # Running Android emulator directly on the runner and not using Docker
  run-emulator:
    needs: build-android
    runs-on: 8-core-ubuntu
    env:
      API_LEVEL: 34
    steps:
      - name: Setup SSH (Click me for login details)
        uses: pytorch/test-infra/.github/actions/setup-ssh@main
        with:
          github-secret: ${{ secrets.GITHUB_TOKEN }}
          instructions: |
            This is used to run Android emulators

      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apps

      - name: Prepare test APK
        run: |
          cp extension/android/executorch_android/build/outputs/apk/androidTest/debug/executorch_android-debug-androidTest.apk android-test-debug-androidTest.apk

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}

      # /dev/kvm on GitHub-hosted Ubuntu runners is not accessible to the runner
      # user by default, which makes android-emulator-runner pass -accel off.
      # Emulator 37.3+ rejects -accel off unless ANDROID_I_WANT_MY_TCG is set.
      - name: Enable KVM
        run: |
          set +e -ux
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo udevadm settle
            ls -l /dev/kvm
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM is available; the emulator will use hardware acceleration"
          else
            echo "::warning::KVM is unavailable on this runner; the Android emulator will run in slow software (TCG) mode"
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
          fi

      # The emulator runner action installs the emulator SDK package
      # itself when missing, with no retry: a corrupt download there
      # ("Error on ZipFile unknown archive", then adb connection
      # refused) fails the job before any test runs. Pre-install the
      # package with retries so the flaky download happens here, where
      # it can be retried, instead of inside the action.
      - name: Pre-install Android emulator package (with retries)
        run: |
          set -ux
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found; skipping emulator pre-install"
            exit 0
          fi
          for attempt in 1 2 3; do
            if yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "emulator" >/dev/null; then
              echo "Emulator package ready (attempt $attempt)"
              exit 0
            fi
            echo "::warning::Emulator package install attempt $attempt failed; retrying"
            sleep 15
          done
          echo "::warning::Could not pre-install the emulator package; the emulator runner step will try on its own"

      - name: Run Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          script: ./scripts/run_android_emulator.sh
          cores: 6
          ram-size: 16384M
          heap-size: 12288M
          force-avd-creation: false
          # The action's built-in animation disabling runs immediately after
          # boot and is not retried. Software-emulated boots can briefly drop
          # adb there, so scripts/run_android_emulator.sh handles it instead.
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          emulator-boot-timeout: 900
