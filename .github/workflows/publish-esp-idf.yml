name: Publish ESP-IDF component

# Publishes pytorch/executorch to the ESP Component Registry: RC tags to the
# staging registry, release tags to staging and then production. The archive
# is built and tested on the ESP-IDF releases the component supports before
# any upload, and each upload is followed by a consumer build that resolves
# the version from that registry. See the release runbook in
# examples/espressif/README.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Version suffix: empty at a release tag, -rc.N at an RC tag, ~N for a packaging respin on release/X.Y'
        type: string
        default: ''
      registry:
        description: 'Registry to publish to; production uploads to staging first'
        type: choice
        options:
          - staging
          - production
        default: staging
      dry_run:
        description: 'Validate the archive with the registry without uploading'
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/publish-esp-idf.yml
      - .ci/scripts/upload_espressif_idf_component.sh
      - .ci/scripts/espressif_idf_upload_requirements.txt

# Runs for one tag or branch go one at a time; runs for different ones, such as
# an RC awaiting approval and its release, do not hold each other up.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-22.04
    outputs:
      package: ${{ steps.plan.outputs.package }}
      rehearsal: ${{ steps.plan.outputs.rehearsal }}
      suffix: ${{ steps.plan.outputs.suffix }}
      version: ${{ steps.plan.outputs.version }}
      staging: ${{ steps.plan.outputs.staging }}
      production: ${{ steps.plan.outputs.production }}
    steps:
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          VERSION_SUFFIX: ${{ inputs.version_suffix }}
          REGISTRY: ${{ inputs.registry }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          package=true rehearsal=false suffix='' version='' staging=false production=false
          case "${EVENT}" in
            push)
              if [[ ! "${REF_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc([1-9][0-9]*))?$ ]]; then
                echo "::notice::${REF_NAME} is not a release or RC tag; nothing to publish."
                package=false
              elif [[ -n "${BASH_REMATCH[3]}" ]]; then
                suffix="-rc.${BASH_REMATCH[3]}" version="${BASH_REMATCH[1]}-rc.${BASH_REMATCH[3]}"
                staging=true
              else
                version="${BASH_REMATCH[1]}" staging=true production=true
              fi
              ;;
            workflow_dispatch)
              if [[ ! "${VERSION_SUFFIX}" =~ ^(-rc\.[1-9][0-9]*|~[1-9][0-9]*)?$ ]]; then
                echo "::error::version_suffix must be empty, -rc.N or ~N, not '${VERSION_SUFFIX}'."
                exit 1
              fi
              if [[ "${VERSION_SUFFIX}" == -rc.* && "${REGISTRY}" == production ]]; then
                echo "::error::release candidates go to the staging registry only."
                exit 1
              fi
              suffix="${VERSION_SUFFIX}"
              if [[ "${DRY_RUN}" != true ]]; then
                staging=true
                [[ "${REGISTRY}" == production ]] && production=true
              fi
              ;;
            *)
              rehearsal=true
              ;;
          esac
          {
            echo "package=${package}"
            echo "rehearsal=${rehearsal}"
            echo "suffix=${suffix}"
            echo "version=${version}"
            echo "staging=${staging}"
            echo "production=${production}"
          } | tee -a "${GITHUB_OUTPUT}"

  docker-image:
    name: Resolve CI docker image
    needs: plan
    if: needs.plan.outputs.package == 'true'
    uses: ./.github/workflows/_docker-image.yml

  package:
    name: Generate and pack the component
    needs: [plan, docker-image]
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      runner: mt-l-x86iavx512-8-64
      docker-image: ${{ needs.docker-image.outputs.docker-registry }}/ci-image:executorch-ubuntu-22.04-clang12-${{ needs.docker-image.outputs.ci-docker-hash }}
      submodules: recursive
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      # The version stamp checks tags and, for a respin, release/X.Y's history.
      fetch-depth: 0
      single-branch: false
      timeout: 60
      upload-artifact: esp-idf-release
      script: |
        set -euo pipefail
        CONDA_ENV=$(conda env list --json | jq -r '.envs | .[-1]')
        conda activate "${CONDA_ENV}"
        source .ci/scripts/utils.sh
        install_executorch --use-pt-pinned-commit --minimal
        if [[ "${{ needs.plan.outputs.rehearsal }}" == true ]]; then
          # A pull request rehearses the release stamp at a throwaway local tag.
          git tag -f "v$(cat version.txt)"
        fi
        # A tag names its version; a dispatch appends its suffix to version.txt.
        expected="${{ needs.plan.outputs.version }}"
        expected="${expected:-$(cat version.txt)${{ needs.plan.outputs.suffix }}}"
        bash .ci/scripts/test_espressif_idf_nightly.sh prepare "${RUNNER_ARTIFACT_DIR}" \
          --version-suffix "${{ needs.plan.outputs.suffix }}"
        version=$(cat "${RUNNER_ARTIFACT_DIR}/version")
        if [[ "${version}" != "${expected}" ]]; then
          echo "FAIL: generated version ${version}, expected ${expected}" >&2
          exit 1
        fi
        echo "Packed pytorch/executorch ${version}"
        # Nothing downstream reads the unpacked component.
        rm -r "${RUNNER_ARTIFACT_DIR}/component"

  dry-run:
    name: Registry validation on ${{ matrix.registry }} (upload --dry-run)
    needs: [docker-image, package]
    strategy:
      fail-fast: false
      matrix:
        registry: [https://components-staging.espressif.com, https://components.espressif.com]
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      runner: mt-l-x86iavx512-8-64
      docker-image: ${{ needs.docker-image.outputs.docker-registry }}/ci-image:executorch-ubuntu-22.04-clang12-${{ needs.docker-image.outputs.ci-docker-hash }}
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: 20
      download-artifact: esp-idf-release
      script: |
        set -euo pipefail
        CONDA_ENV=$(conda env list --json | jq -r '.envs | .[-1]')
        conda activate "${CONDA_ENV}"
        bash .ci/scripts/upload_espressif_idf_component.sh "${RUNNER_ARTIFACT_DIR}" \
          "${{ matrix.registry }}" --dry-run

  build:
    name: ESP-IDF ${{ matrix.idf-version }} (${{ matrix.shard }}/4)
    needs: [docker-image, package]
    strategy:
      fail-fast: false
      matrix:
        idf-version: [v6.0.1, v6.1]
        shard: [1, 2, 3, 4]
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      runner: mt-l-x86iavx512-8-64
      docker-image: ${{ needs.docker-image.outputs.docker-registry }}/ci-image:executorch-ubuntu-22.04-clang12-${{ needs.docker-image.outputs.ci-docker-hash }}
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: 120
      download-artifact: esp-idf-release
      script: |
        set -euo pipefail
        CONDA_ENV=$(conda env list --json | jq -r '.envs | .[-1]')
        conda activate "${CONDA_ENV}"
        ESPRESSIF_IDF_VERSION="${{ matrix.idf-version }}" \
          bash .ci/scripts/test_espressif_idf_nightly.sh build "${RUNNER_ARTIFACT_DIR}" \
          "${{ matrix.shard }}" 4

  upload-staging:
    name: Upload to the staging registry
    needs: [plan, dry-run, build]
    if: needs.plan.outputs.staging == 'true'
    runs-on: ubuntu-22.04
    environment: esp-component-registry
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: esp-idf-release
          path: ${{ runner.temp }}/esp-idf-release
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: |
          bash .ci/scripts/upload_espressif_idf_component.sh "${RUNNER_TEMP}/esp-idf-release" \
            https://components-staging.espressif.com

  verify-staging:
    name: Build the consumer from the staging registry
    needs: [docker-image, upload-staging]
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      runner: mt-l-x86iavx512-8-64
      docker-image: ${{ needs.docker-image.outputs.docker-registry }}/ci-image:executorch-ubuntu-22.04-clang12-${{ needs.docker-image.outputs.ci-docker-hash }}
      ref: ${{ github.sha }}
      timeout: 60
      download-artifact: esp-idf-release
      script: |
        set -euo pipefail
        CONDA_ENV=$(conda env list --json | jq -r '.envs | .[-1]')
        conda activate "${CONDA_ENV}"
        bash .ci/scripts/test_espressif_idf_nightly.sh registry "${RUNNER_ARTIFACT_DIR}" \
          https://components-staging.espressif.com

  upload-production:
    name: Upload to the production registry
    needs: [plan, verify-staging]
    if: needs.plan.outputs.production == 'true'
    runs-on: ubuntu-22.04
    environment: esp-component-registry
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: esp-idf-release
          path: ${{ runner.temp }}/esp-idf-release
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: |
          bash .ci/scripts/upload_espressif_idf_component.sh "${RUNNER_TEMP}/esp-idf-release" \
            https://components.espressif.com

  verify-production:
    name: Build the consumer from the production registry
    needs: [docker-image, upload-production]
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      runner: mt-l-x86iavx512-8-64
      docker-image: ${{ needs.docker-image.outputs.docker-registry }}/ci-image:executorch-ubuntu-22.04-clang12-${{ needs.docker-image.outputs.ci-docker-hash }}
      ref: ${{ github.sha }}
      timeout: 60
      download-artifact: esp-idf-release
      script: |
        set -euo pipefail
        CONDA_ENV=$(conda env list --json | jq -r '.envs | .[-1]')
        conda activate "${CONDA_ENV}"
        bash .ci/scripts/test_espressif_idf_nightly.sh registry "${RUNNER_ARTIFACT_DIR}" \
          https://components.espressif.com
