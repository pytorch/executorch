# Single source of truth for the OSDC build-runner labels used by the wheel build
# workflows: release-isolated (mt-rel-l-*) runners on protected refs, and the
# caller's existing default otherwise. Callers pass the outputs to
# build_wheels_linux.yml's `runner` input, which falls back to the build matrix's
# validation_runner when it is empty.
name: Select release runner

on:
  workflow_call:
    outputs:
      x86:
        description: "x86_64 build runner label, empty to keep the matrix default"
        value: ${{ jobs.select.outputs.x86 }}
      arm64:
        description: "aarch64 build runner label, empty to keep the matrix default"
        value: ${{ jobs.select.outputs.arm64 }}

jobs:
  select:
    if: github.repository_owner == 'pytorch'
    runs-on: ubuntu-24.04
    outputs:
      x86: ${{ steps.pick.outputs.x86 }}
      arm64: ${{ steps.pick.outputs.arm64 }}
    steps:
      - id: pick
        shell: bash
        run: |
          # The refs the wheel workflows publish from. main is absent because
          # they do not build on it.
          protected=false
          case "${GITHUB_REF}" in
            refs/heads/nightly|refs/heads/release/*|refs/tags/v*) protected=true ;;
          esac
          if [[ "${protected}" == "true" ]]; then
            echo "x86=mt-rel-l-x86iavx512-44-340" >> "${GITHUB_OUTPUT}"
            echo "arm64=mt-rel-l-arm64g3-44-340" >> "${GITHUB_OUTPUT}"
          else
            echo "x86=" >> "${GITHUB_OUTPUT}"
            echo "arm64=" >> "${GITHUB_OUTPUT}"
          fi
