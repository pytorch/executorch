name: Weekly PyTorch and TorchAO Pin Bump

on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 9:00 UTC
  workflow_dispatch:

jobs:
  create-pin-bump-pr:
    if: github.repository_owner == 'pytorch'
    runs-on: ubuntu-latest
    environment: update-commit-hash
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.UPDATEBOT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine newest nightly date
        id: nightly
        run: |
          NIGHTLY_DATE=$(date -u -d 'yesterday' '+%Y%m%d')
          echo "date=${NIGHTLY_DATE}" >> "$GITHUB_OUTPUT"

      - name: Run pin bump script
        run: python .github/scripts/update_pytorch_pin.py --nightly-date "${{ steps.nightly.outputs.date }}"

      - name: Read selected PyTorch version
        id: pytorch
        run: |
          PYTORCH_VERSION=$(python -c "from torch_pin import PYTORCH_VERSION; print(PYTORCH_VERSION)")
          echo "version=${PYTORCH_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create branch and PR
        env:
          GH_TOKEN: ${{ secrets.UPDATEBOT_TOKEN }}
        run: |
          BRANCH="automated/pytorch-pin-bump-${{ steps.pytorch.outputs.version }}"

          git config user.name "pytorchbot"
          git config user.email "pytorchbot@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add torch_pin.py
          git add .ci/docker/ci_commit_pins/pytorch.txt
          git add runtime/core/portable_type/c10/
          git add third-party/ao

          if git diff --cached --quiet; then
            echo "No changes to commit. Pin is already up to date."
            exit 0
          fi

          git commit -m "Bump PyTorch and TorchAO pins for ${{ steps.pytorch.outputs.version }}"
          git push -u origin "${BRANCH}"

          EXISTING=$(gh pr list --label "ci/pytorch-pin-bump" --state open --json number --jq '.[0].number')
          if [ -n "${EXISTING}" ]; then
            echo "Closing existing pin bump PR #${EXISTING} in favor of new one"
            gh pr close "${EXISTING}" --comment "Superseded by newer pin bump."
          fi

          NIGHTLY="${{ steps.pytorch.outputs.version }}"
          read -r -d '' PR_BODY <<EOF || true
          ## Summary

          Automated weekly PyTorch and TorchAO pin bump.

          - Updates the PyTorch nightly package set in \`torch_pin.py\` to \`${NIGHTLY}\`
          - Updates \`.ci/docker/ci_commit_pins/pytorch.txt\` to the corresponding nightly commit hash
          - Syncs c10 headers from PyTorch into \`runtime/core/portable_type/c10/\`
          - Updates the TorchAO nightly pins and \`third-party/ao\` to the newest build available for every supported CUDA channel

          This PR was created automatically. If CI fails, Claude will attempt to fix issues (up to 3 attempts). If CI still fails, human review will be requested.

          cc @jakeszwe
          EOF
          PR_BODY=$(echo "${PR_BODY}" | sed 's/^          //')

          gh pr create \
            --title "Bump PyTorch and TorchAO pins for ${NIGHTLY}" \
            --body "${PR_BODY}" \
            --label "ci/pytorch-pin-bump" \
            --label "ciflow/cuda"
