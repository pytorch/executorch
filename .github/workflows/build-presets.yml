name: Build Presets

on:
  pull_request:
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}-${{ github.event_name == 'workflow_dispatch' }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

jobs:
  # linux_job_v3 needs a fully qualified image: the OSDC runner pod pulls the
  # container before any step runs, so nothing in the job can resolve it.
  docker-image:
    name: Resolve CI docker image
    uses: ./.github/workflows/_docker-image.yml

  apple:
    uses: pytorch/test-infra/.github/workflows/macos_job.yml@main
    strategy:
      fail-fast: false
      matrix:
        preset: [macos, ios, ios-simulator, pybind, profiling, llm]
    with:
      default-packages: ""
      job-name: build
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      runner: macos-14-xlarge
      python-version: 3.12
      submodules: recursive
      timeout: 90
      script: |
        set -eux
        ${CONDA_RUN} ./install_requirements.sh > /dev/null
        ${CONDA_RUN} cmake --preset ${{ matrix.preset }}
        ${CONDA_RUN} cmake --build cmake-out -j$(( $(sysctl -n hw.ncpu) - 1 ))

  zephyr:
    needs: docker-image
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        preset: [zephyr]
    with:
      job-name: build
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      runner: mt-l-x86iavx512-8-64
      docker-image: 308535385114.dkr.ecr.us-east-1.amazonaws.com/executorch/ci-image:executorch-ubuntu-22.04-zephyr-sdk-${{ needs.docker-image.outputs.ci-docker-hash }}
      submodules: recursive
      timeout: 90
      script: |
        set -eux
        # The generic Linux job chooses to use base env, not the one setup by the image
        CONDA_ENV=$(conda env list --json | jq -r ".envs | .[-1]")
        conda activate "${CONDA_ENV}"

        ./install_requirements.sh > /dev/null

        # Download toolchain
        toolchain_url="https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.2/toolchain_linux-x86_64_arm-zephyr-eabi.tar.xz"
        toolchain_dir="arm-zephyr-eabi"
        curl --output "${toolchain_dir}.tar.xz" -L "${toolchain_url}"

        # Verify download
        echo "93128be0235cf5cf5f1ee561aa6eac5f  ${toolchain_dir}.tar.xz" > arm-zephyr-eabi.md5
        md5sum -c --strict arm-zephyr-eabi.md5

        # Extract and install to PATH
        tar xf "${toolchain_dir}.tar.xz"
        rm -f "${toolchain_dir}.tar.xz"
        toolchain_bin_path="$(cd ${toolchain_dir}/bin && pwd)"
        export PATH=$PATH:${toolchain_bin_path}

        # Build Arm Zephyr Preset
        cmake --preset ${{ matrix.preset }}
        cmake --build cmake-out -j$(( $(nproc) - 1 ))
  linux:
    needs: docker-image
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        preset: [linux, pybind, llm]
        runner: [mt-l-x86iavx512-8-64, mt-l-arm64g4-16-62]
        docker-image: [executorch-ubuntu-22.04-clang12, executorch-ubuntu-22.04-gcc11-aarch64]
        # Excluding specific runner + docker image combinations that don't make sense:
        #   - Excluding the ARM64 gcc image on the x86 runner
        #   - Excluding the x86 clang image on the ARM64 runner
        exclude:
          - runner: mt-l-x86iavx512-8-64
            docker-image: executorch-ubuntu-22.04-gcc11-aarch64
          - runner: mt-l-arm64g4-16-62
            docker-image: executorch-ubuntu-22.04-clang12
    with:
      job-name: build
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      runner: ${{ matrix.runner }}
      docker-image: 308535385114.dkr.ecr.us-east-1.amazonaws.com/executorch/ci-image:${{ matrix.docker-image }}-${{ needs.docker-image.outputs.ci-docker-hash }}
      submodules: recursive
      timeout: 90
      script: |
        set -eux
        # The generic Linux job chooses to use base env, not the one setup by the image
        CONDA_ENV=$(conda env list --json | jq -r ".envs | .[-1]")
        conda activate "${CONDA_ENV}"

        ./install_requirements.sh > /dev/null
        cmake --preset ${{ matrix.preset }}
        cmake --build cmake-out -j$(( $(nproc) - 1 ))

  windows:
    uses: pytorch/test-infra/.github/workflows/windows_job.yml@main
    strategy:
      fail-fast: false
      matrix:
        preset: [pybind, windows]
    with:
      job-name: build
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: 90
      script: |
        set -eux
        git config --global http.sslBackend openssl
        git submodule update --init --recursive
        conda init powershell
        powershell -Command "& {
          Set-PSDebug -Trace 1
          \$ErrorActionPreference = 'Stop'
          \$PSNativeCommandUseErrorActionPreference = \$true

          conda create --yes --quiet -n et python=3.12
          conda activate et
          python install_requirements.py

          cmake --preset ${{ matrix.preset }} -T ClangCL
          if (\$LASTEXITCODE -ne 0) {
            Write-Host "CMake configuration was unsuccessful. Exit code: \$LASTEXITCODE."
            exit \$LASTEXITCODE
          }

          \$numCores = [System.Environment]::GetEnvironmentVariable('NUMBER_OF_PROCESSORS') - 1
          cmake --build cmake-out -j \$numCores
          if (\$LASTEXITCODE -ne 0) {
            Write-Host "CMake build was unsuccessful. Exit code: \$LASTEXITCODE."
            exit \$LASTEXITCODE
          }
        }"
