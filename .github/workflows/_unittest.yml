name: Run all unittests

on:
  workflow_call:
    inputs:
      docker-image:
        required: true
        type: string
        description: |
          ECR repository and tag prefix of the CI image, e.g.
          ci-image:executorch-ubuntu-22.04-clang12. The registry and the
          .ci/docker hash are appended by this workflow.
      build-mode:
        required: true
        type: string
        description: Build mode to use, Debug or Release.
      build-tool:
        required: true
        type: string
        description: Build tool to use, cmake or buck2.
      editable:
        required: false
        type: string
        description: Install ExecuTorch in editable mode or not.
        default: 'false'
      python-version:
        required: false
        type: string
        default: '3.10'
      linux-timeout:
        required: false
        type: number
        default: 90

jobs:
  # linux_job_v3 needs a fully qualified image: the OSDC runner pod pulls the
  # container before any step runs, so nothing in the job can resolve it.
  docker-image:
    name: Resolve CI docker image
    uses: ./.github/workflows/_docker-image.yml

  linux:
    needs: docker-image
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      runner: mt-l-x86iavx512-8-64
      docker-image: 308535385114.dkr.ecr.us-east-1.amazonaws.com/executorch/${{ inputs.docker-image }}-${{ needs.docker-image.outputs.ci-docker-hash }}
      submodules: 'recursive'
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: ${{ inputs.linux-timeout }}
      script: |
        set -eux
        .ci/scripts/unittest-linux.sh --build-tool "${{ inputs.build-tool }}" --build-mode "${{ inputs.build-mode }}" --editable "${{ inputs.editable }}"

  macos:
    uses: pytorch/test-infra/.github/workflows/macos_job.yml@main
    with:
      default-packages: ""
      runner: macos-m1-stable
      python-version: '3.11'
      submodules: 'recursive'
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: 120
      script: |
        set -eux
        # This is needed to get the prebuilt PyTorch wheel from S3
        ${CONDA_RUN} --no-capture-output pip install awscli==1.37.21
        .ci/scripts/unittest-macos.sh --build-tool "${{ inputs.build-tool }}" --build-mode "${{ inputs.build-mode }}" --editable "${{ inputs.editable }}"

  windows:
    if: ${{ inputs.build-tool == 'cmake' }}
    uses: pytorch/test-infra/.github/workflows/windows_job.yml@main
    with:
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: 120
      script: |
        git config --global http.sslBackend openssl
        git submodule update --init --recursive 
        conda init powershell

        powershell -Command "& {
          Set-PSDebug -Trace 1
          \$ErrorActionPreference = 'Stop'
          \$PSNativeCommandUseErrorActionPreference = \$true

          .ci/scripts/setup-windows.ps1 -editable "${{ inputs.editable }}" -cpuOnly true
          if (\$LASTEXITCODE -ne 0) {
              Write-Host "Setup failed. Exit code: \$LASTEXITCODE."
              exit \$LASTEXITCODE
          }

          .ci/scripts/unittest-windows.ps1 -buildMode "${{ inputs.build-mode }}"
          if (\$LASTEXITCODE -ne 0) {
              Write-Host "Unit tests failed. Exit code: \$LASTEXITCODE."
              exit \$LASTEXITCODE
          }
        }"
