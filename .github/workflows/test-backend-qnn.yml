name: Test QNN Backend

on:
  schedule:
    - cron: 0 2 * * *
  push:
    branches:
      - main
      - release/*
    tags:
      - ciflow/nightly/*
  pull_request:
  workflow_dispatch:
    inputs:
      seeded_controls:
        description: Compare discrepant QNN operator cases on rc3 and rc4 with fixed seeds
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}-${{ github.event_name == 'workflow_dispatch' }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

jobs:
  test-qnn:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.seeded_controls }}
    uses: ./.github/workflows/_test_backend.yml
    permissions:
      id-token: write
      contents: read
    with:
      backend: qnn
      flows: >-
        ${{ github.event_name == 'pull_request'
            && '["qnn"]'
            || '["qnn", "qnn_16a16w", "qnn_16a8w", "qnn_16a4w", "qnn_16a4w_block", "qnn_8a8w"]' }}
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: 120
      run-linux: true
      runner-linux: mt-l-x86iavx512-32-256

  control-docker-image:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.seeded_controls }}
    uses: ./.github/workflows/_docker-image.yml

  seeded-qnn-controls:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.seeded_controls }}
    needs: control-docker-image
    strategy:
      fail-fast: false
      matrix:
        source_ref: [v1.6.0-rc3, v1.6.0-rc4]
        flow: [qnn_16a4w, qnn_16a8w, qnn_8a8w]
        include:
          - flow: qnn_16a4w
            selection: test_index_put_in_place_indices or test_lstm_feature_sizes
          - flow: qnn_16a8w
            selection: test_log10_shapes
          - flow: qnn_8a8w
            selection: test_floor_divide_scalar_divisors or test_index_put_in_place_indices
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      ref: ${{ matrix.source_ref }}
      runner: mt-l-x86iavx512-32-256
      docker-image: ${{ needs.control-docker-image.outputs.docker-registry }}/ci-image:executorch-ubuntu-22.04-clang12-${{ needs.control-docker-image.outputs.ci-docker-hash }}
      submodules: recursive
      timeout: 120
      upload-artifact: test-report-qnn-seeded-${{ matrix.source_ref }}-${{ matrix.flow }}
      script: |
        set -euxo pipefail
        git rev-parse HEAD
        CONTROL_SELECTION='${{ matrix.selection }}'
        CONTROL_EXIT_CODE=0
        CONTROL_PYTEST=$(mktemp)
        trap 'rm -f "$CONTROL_PYTEST"' EXIT
        cat > "$CONTROL_PYTEST" <<'PY'
        import json
        import random
        import shutil
        import sys
        from pathlib import Path

        import numpy as np
        import pytest
        import torch

        seed = int(sys.argv[1])
        selection = sys.argv[2]
        original = iter(sys.argv[3:])
        arguments = []
        report = None
        seeded_report = None
        for argument in original:
            if argument == "-n":
                next(original)
                continue
            if argument.startswith("--json-report-file="):
                report = Path(argument.split("=", 1)[1])
                seeded_report = report.with_name(f"{report.stem}-seed-{seed}{report.suffix}")
                argument = f"--json-report-file={seeded_report}"
            arguments.append(argument)
        arguments += ["-n", "0", "-k", selection]

        class SeedBeforeTest:
            @pytest.hookimpl(tryfirst=True)
            def pytest_runtest_setup(self, item):
                random.seed(seed)
                np.random.seed(seed)
                torch.manual_seed(seed)

        exit_code = int(pytest.main(arguments, plugins=[SeedBeforeTest()]))
        if seeded_report is not None and seeded_report.exists():
            shutil.copyfile(seeded_report, report)
        print(json.dumps({"seed": seed, "pytest_exit_code": exit_code}), flush=True)
        sys.exit(exit_code)
        PY
        # Keep CI's setup and test implementation; replace only pytest's seed and selection.
        pytest() {
          local seed status
          for seed in 0 1 2; do
            if python "$CONTROL_PYTEST" "$seed" "$CONTROL_SELECTION" "$@"; then
              status=0
            else
              status=$?
            fi
            printf '%s,%s\n' "$seed" "$status" >> "$RUNNER_ARTIFACT_DIR/seed-exit-codes.csv"
            if [[ "$status" != 0 ]]; then
              CONTROL_EXIT_CODE="$status"
            fi
          done
          return 0
        }
        source .ci/scripts/test_backend.sh operators '${{ matrix.flow }}' "$RUNNER_ARTIFACT_DIR"
        exit "$CONTROL_EXIT_CODE"
