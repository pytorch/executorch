name: pull

on:
  pull_request:
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' && github.run_id }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

jobs:
  docker-image:
    name: Resolve CI docker image
    uses: ./.github/workflows/_docker-image.yml

  # Emits the list of changed files for the current PR or push commit.
  # On PR: PR diff. On push: diff against `github.event.before`.
  # On events without a diff base (workflow_dispatch, tag creation,
  # initial push), emits '*' — note that `contains('*', 'path')` is
  # false (literal substring match, not glob), so path-filtered jobs
  # rely on run-decision's is-full-run output for those events.

  test-lora-multimethod-linux:
    needs: docker-image
    name: test-lora-multimethod-linux
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@osdc/pin-ue2
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
    with:
      runner: mt-l-x86iavx512-94-192
      docker-image: ${{ needs.docker-image.outputs.docker-registry }}/ci-image:executorch-ubuntu-22.04-clang12-${{ needs.docker-image.outputs.ci-docker-hash }}
      submodules: 'recursive'
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: 90
      script: |
        # The generic Linux job chooses to use base env, not the one setup by the image
        CONDA_ENV=$(conda env list --json | jq -r ".envs | .[-1]")
        conda activate "${CONDA_ENV}"

        PYTHON_EXECUTABLE=python bash .ci/scripts/setup-linux.sh --build-tool "cmake"

        # Install llama requirements
        bash examples/models/llama/install_requirements.sh

        # run llama runner in eager mode
        PYTHON_EXECUTABLE=python bash .ci/scripts/test_lora_multimethod.sh

  test-lora-linux:
    needs: docker-image
    name: test-lora-linux
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@osdc/pin-ue2
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
    with:
      runner: mt-l-x86iavx512-94-192
      docker-image: ${{ needs.docker-image.outputs.docker-registry }}/ci-image:executorch-ubuntu-22.04-clang12-${{ needs.docker-image.outputs.ci-docker-hash }}
      submodules: 'recursive'
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: 90
      script: |
        # The generic Linux job chooses to use base env, not the one setup by the image
        CONDA_ENV=$(conda env list --json | jq -r ".envs | .[-1]")
        conda activate "${CONDA_ENV}"

        PYTHON_EXECUTABLE=python bash .ci/scripts/setup-linux.sh --build-tool "cmake"

        # Install llama requirements
        bash examples/models/llama/install_requirements.sh

        # run llama runner in eager mode
        PYTHON_EXECUTABLE=python bash .ci/scripts/test_lora.sh
