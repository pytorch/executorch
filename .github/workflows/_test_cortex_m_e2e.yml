name: Test Cortex-M e2e

permissions:
  id-token: write
  contents: read

on:
  workflow_call:
    inputs:
      models:
        description: 'JSON array of model names to run on the Corstone-300 FVP, e.g. ["mv2", "mv3"]'
        required: true
        type: string
      targets:
        description: 'JSON array of cortex-m target CPUs to build the runner for, e.g. ["cortex-m55", "cortex-m7", "cortex-m0plus"]'
        required: false
        type: string
        default: '["cortex-m55"]'
      timeout:
        description: 'Per-matrix-entry timeout in minutes'
        required: false
        type: number
        default: 120

jobs:
  # linux_job_v3 needs a fully qualified image: the OSDC runner pod pulls the
  # container before any step runs, so nothing in the job can resolve it.
  docker-image:
    name: Resolve CI docker image
    uses: ./.github/workflows/_docker-image.yml

  run:
    needs: docker-image
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        model: ${{ fromJSON(inputs.models) }}
        target: ${{ fromJSON(inputs.targets) }}
      fail-fast: false
    with:
      job-name: ${{ matrix.model }}-${{ matrix.target }}
      runner: mt-l-x86iavx512-8-64
      docker-image: 308535385114.dkr.ecr.us-east-1.amazonaws.com/executorch/ci-image:executorch-ubuntu-22.04-arm-sdk-${{ needs.docker-image.outputs.ci-docker-hash }}
      submodules: 'recursive'
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: ${{ inputs.timeout }}
      script: |
        # The generic Linux job chooses to use base env, not the one setup by the image
        CONDA_ENV=$(conda env list --json | jq -r ".envs | .[-1]")
        conda activate "${CONDA_ENV}"

        source .ci/scripts/utils.sh
        install_executorch "--use-pt-pinned-commit"

        # Install arm dependencies
        .ci/scripts/setup-arm-baremetal-tools.sh
        source examples/arm/arm-scratch/setup_path.sh

        # Export and run model on FVP (run.sh internally builds the test runner).
        bash .ci/scripts/test_cortex_m_e2e.sh "${{ matrix.model }}" "${{ matrix.target }}"
