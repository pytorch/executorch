name: Test ARM Backend

on:
  schedule:
    - cron: 0 2 * * *
  push:
    branches:
      - main
      - release/*
    tags:
      - ciflow/nightly/*
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}-${{ github.event_name == 'workflow_dispatch' }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

jobs:
  test-arm:
    uses: ./.github/workflows/_test_backend.yml
    permissions:
      id-token: write
      contents: read
    with:
      backend: arm
      flows: '["arm_tosa_fp","arm_tosa_int","arm_ethos_u55","arm_ethos_u85"]'
      reduced-flows: '["arm_tosa_fp"]'
      backend-paths: '["backends/arm/**","examples/arm/**",".github/workflows/test-backend-arm.yml","backends/cortex_m/**","zephyr/**"]'
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: 120
      run-linux: true
      docker-image: ci-image:executorch-ubuntu-22.04-arm-sdk

  test-arm-vgf:
    uses: ./.github/workflows/_test_backend.yml
    permissions:
      id-token: write
      contents: read
    with:
      backend: arm-vgf
      flows: '["arm_vgf_fp","arm_vgf_int"]'
      reduced-flows: '["arm_vgf_fp"]'
      backend-paths: '["backends/arm/**","examples/arm/**",".github/workflows/test-backend-arm.yml","backends/cortex_m/**","zephyr/**"]'
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: 120
      run-linux: true
      docker-image: ci-image:executorch-ubuntu-24.04-arm-sdk
