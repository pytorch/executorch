name: Test ARM Backend

on:
  schedule:
    - cron: 0 2 * * *
  push:
    branches:
      - main
      - release/*
    tags:
      - ciflow/nightly/*
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}-${{ github.event_name == 'workflow_dispatch' }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

jobs:
  test-arm:
    uses: ./.github/workflows/_test_backend.yml
    permissions:
      id-token: write
      contents: read
    with:
      backend: arm
      # The full flow matrix runs nightly, on release branches, and on manual
      # or ciflow-tag runs. Pushes to main get the same reduced matrix as pull
      # requests: a regression in the other flows still surfaces within a day,
      # without paying for the full matrix on every merge.
      flows: >-
        ${{ (github.event_name == 'schedule'
             || github.event_name == 'workflow_dispatch'
             || startsWith(github.ref, 'refs/heads/release/')
             || startsWith(github.ref, 'refs/tags/ciflow/'))
            && '["arm_tosa_fp", "arm_tosa_int",
                 "arm_ethos_u55", "arm_ethos_u85"]'
            || '["arm_tosa_fp"]' }}
      ref: ${{ github.event_name == 'pull_request'
               && github.event.pull_request.head.sha
               || github.sha }}
      timeout: 120
      run-linux: true
      docker-image: ci-image:executorch-ubuntu-22.04-arm-sdk

  test-arm-vgf:
    uses: ./.github/workflows/_test_backend.yml
    permissions:
      id-token: write
      contents: read
    with:
      backend: arm-vgf
      # The full flow matrix runs nightly, on release branches, and on manual
      # or ciflow-tag runs. Pushes to main get the same reduced matrix as pull
      # requests: a regression in the other flows still surfaces within a day,
      # without paying for the full matrix on every merge.
      flows: >-
        ${{ (github.event_name == 'schedule'
             || github.event_name == 'workflow_dispatch'
             || startsWith(github.ref, 'refs/heads/release/')
             || startsWith(github.ref, 'refs/tags/ciflow/'))
            && '["arm_vgf_fp", "arm_vgf_int"]'
            || '["arm_vgf_fp"]' }}
      ref: ${{ github.event_name == 'pull_request'
               && github.event.pull_request.head.sha
               || github.sha }}
      timeout: 120
      run-linux: true
      docker-image: ci-image:executorch-ubuntu-24.04-arm-sdk
