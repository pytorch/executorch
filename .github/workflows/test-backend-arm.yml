name: Test ARM Backend

on:
  schedule:
    - cron: 0 2 * * *
  push:
    branches:
      - main
      - release/*
    tags:
      - ciflow/nightly/*
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}-${{ github.event_name == 'workflow_dispatch' }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

jobs:
  test-arm:
    uses: ./.github/workflows/_test_backend.yml
    permissions:
      id-token: write
      contents: read
    with:
      backend: arm
      flows: >-
        ${{ github.event_name == 'pull_request'
            && '["arm_tosa_fp"]'
            || '["arm_tosa_fp", "arm_tosa_int",
                 "arm_ethos_u55", "arm_ethos_u85"]' }}
      ref: ${{ github.event_name == 'pull_request'
               && github.event.pull_request.head.sha
               || github.sha }}
      timeout: 120
      run-linux: true
      docker-image: ci-image:executorch-ubuntu-22.04-arm-sdk
      # The Ethos-U flows run a Corstone FVP per worker and the failures each
      # emit a Vela dump of a few hundred thousand lines, which killed the pod
      # once `auto` stopped discounting hyperthreads: linux.4xlarge.memory gave
      # 8 workers 16GiB each, the OSDC label gives 15 workers 7.7GiB each. 8
      # keeps what the suite had.
      pytest-workers: 8

  test-arm-vgf:
    uses: ./.github/workflows/_test_backend.yml
    permissions:
      id-token: write
      contents: read
    with:
      backend: arm-vgf
      flows: >-
        ${{ github.event_name == 'pull_request'
            && '["arm_vgf_fp"]'
            || '["arm_vgf_fp", "arm_vgf_int"]' }}
      ref: ${{ github.event_name == 'pull_request'
               && github.event.pull_request.head.sha
               || github.sha }}
      timeout: 120
      run-linux: true
      docker-image: ci-image:executorch-ubuntu-24.04-arm-sdk
