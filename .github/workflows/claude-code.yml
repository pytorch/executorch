name: Claude Code

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude-code:
    uses: pytorch/test-infra/.github/workflows/_claude-code.yml@main
    with:
      # No other effort level is recognized. The issue body is read only on issue
      # events, because on a comment it holds the issue or PR description.
      additional_claude_args: --allowedTools Skill ${{ (startsWith(github.event.comment.body, '@claude /pr-review') || contains(github.event.comment.body, 'effort=max') || (github.event_name == 'issues' && contains(github.event.issue.body, 'effort=max'))) && '--effort max' || '' }}
      append_system_prompt: |
        When asked to review a PR, always use the /pr-review skill first.
        Put the detailed review inside a GitHub collapsible section and a
        one-sentence summary outside it.
      setup_script: |
        pip install lintrunner==0.12.7 lintrunner-adapters==0.14.1
        pip install -r requirements-lintrunner.txt
        lintrunner init
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    secrets: inherit
