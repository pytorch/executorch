name: Test Vulkan Backend

on:
  schedule:
    - cron: 0 2 * * *
  push:
    branches:
      - main
      - release/*
    tags:
      - ciflow/nightly/*
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}-${{ github.event_name == 'workflow_dispatch' }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

jobs:
  # Default coverage: builds + runs on SwiftShader (software Vulkan) on CPU
  # runners. Runs on every PR and nightly.
  test-vulkan:
    uses: ./.github/workflows/_test_backend.yml
    permissions:
      id-token: write
      contents: read
    with:
      backend: vulkan
      # The full flow matrix runs nightly, on release branches, and on manual
      # or ciflow-tag runs. Pushes to main get the same reduced matrix as pull
      # requests: a regression in the other flows still surfaces within a day,
      # without paying for the full matrix on every merge.
      flows: >-
        ${{ (github.event_name == 'schedule'
             || github.event_name == 'workflow_dispatch'
             || startsWith(github.ref, 'refs/heads/release/')
             || startsWith(github.ref, 'refs/tags/ciflow/'))
            && '["vulkan", "vulkan_static_int8_per_channel"]'
            || '["vulkan"]' }}
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: 120
      run-linux: true

  # Real-GPU (NVIDIA) and Windows MSVC coverage live in vulkan.yml, which gates
  # those scarce/expensive runners behind path filtering.
