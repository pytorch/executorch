name: Nightly ESP-IDF component

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
  push:
    tags:
      - ciflow/nightly/*
  # test-espressif.yml builds and runs the packed component on every pull
  # request that can change it, so pull requests run this matrix only when they
  # change the matrix itself; the ciflow/nightly label runs it on any other.
  pull_request:
    paths:
      - .github/workflows/nightly-espressif-idf.yml
      - .ci/scripts/test_espressif_idf_nightly.sh
      - .ci/scripts/test_espressif_idf_configure.py
      - examples/espressif/idf_component_consumer/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-image:
    name: Resolve CI docker image
    uses: ./.github/workflows/_docker-image.yml

  prepare:
    name: Generate the component and test models
    needs: docker-image
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      runner: mt-l-x86iavx512-8-64
      docker-image: ${{ needs.docker-image.outputs.docker-registry }}/ci-image:executorch-ubuntu-22.04-clang12-${{ needs.docker-image.outputs.ci-docker-hash }}
      submodules: recursive
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: 60
      upload-artifact: esp-idf-nightly-inputs
      script: |
        set -euo pipefail
        CONDA_ENV=$(conda env list --json | jq -r '.envs | .[-1]')
        conda activate "${CONDA_ENV}"
        source .ci/scripts/utils.sh
        install_executorch --use-pt-pinned-commit --minimal
        bash .ci/scripts/test_espressif_idf_nightly.sh prepare "${RUNNER_ARTIFACT_DIR}"
        # The registry's validation of the packed archive, last, since it
        # installs the component manager into this environment.
        pip install --progress-bar off "idf-component-manager~=3.1"
        version=$(cat "${RUNNER_ARTIFACT_DIR}/version")
        compote component upload --namespace pytorch --name executorch \
          --archive "${RUNNER_ARTIFACT_DIR}/dist/executorch_${version}.tgz" --dry-run --allow-existing

  build:
    name: ESP-IDF ${{ matrix.idf-version }} (${{ matrix.shard }}/4)
    needs: [docker-image, prepare]
    strategy:
      fail-fast: false
      matrix:
        # ESP-IDF master breaks on its own schedule, so pull requests leave it
        # to the scheduled, dispatched and ciflow runs.
        idf-version: ${{ github.event_name == 'pull_request' && fromJSON('["v6.0.1", "v6.1"]') || fromJSON('["v6.0.1", "v6.1", "master"]') }}
        shard: [1, 2, 3, 4]
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      runner: mt-l-x86iavx512-8-64
      docker-image: ${{ needs.docker-image.outputs.docker-registry }}/ci-image:executorch-ubuntu-22.04-clang12-${{ needs.docker-image.outputs.ci-docker-hash }}
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: 120
      download-artifact: esp-idf-nightly-inputs
      upload-artifact: esp-idf-nightly-logs-${{ matrix.idf-version }}-${{ matrix.shard }}
      upload-artifact-to-s3: true
      script: |
        set -euo pipefail
        CONDA_ENV=$(conda env list --json | jq -r '.envs | .[-1]')
        conda activate "${CONDA_ENV}"
        # The artifact directory holds the inputs on the way in and the logs on
        # the way out.
        inputs="${RUNNER_TEMP}/esp-idf-nightly-inputs"
        work="${RUNNER_TEMP}/esp-idf-nightly"
        mkdir -p "${inputs}"
        mv "${RUNNER_ARTIFACT_DIR}"/* "${inputs}/"
        # Every job's logs go to the run's one S3 prefix, which keeps them 14
        # days rather than GitHub's 2. An upload to S3 fails on a name already
        # taken, so each log is named for its matrix entry and attempt.
        entry="${{ matrix.idf-version }}-${{ matrix.shard }}-attempt${{ github.run_attempt }}"
        trap 'for log in "${work}"/*.log; do cp "${log}" "${RUNNER_ARTIFACT_DIR}/${entry}-${log##*/}"; done 2> /dev/null || true' EXIT
        ESPRESSIF_IDF_VERSION="${{ matrix.idf-version }}" ESPRESSIF_BUILD_DIR="${work}" \
          bash .ci/scripts/test_espressif_idf_nightly.sh build "${inputs}" "${{ matrix.shard }}" 4

  configure-macos:
    name: Configure on macOS
    needs: prepare
    uses: pytorch/test-infra/.github/workflows/macos_job.yml@main
    with:
      default-packages: ""
      runner: macos-15-xlarge
      python-version: '3.12'
      submodules: recursive
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: 120
      download-artifact: esp-idf-nightly-inputs
      script: |
        set -eux
        ${CONDA_RUN} ./install_executorch.sh --minimal
        ${CONDA_RUN} python .ci/scripts/test_espressif_idf_configure.py \
          --inputs "${RUNNER_ARTIFACT_DIR}" --work-dir "${RUNNER_TEMP}/esp-idf-configure"

  configure-windows:
    name: Configure on Windows
    needs: prepare
    uses: pytorch/test-infra/.github/workflows/windows_job.yml@main
    with:
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: 150
      download-artifact: esp-idf-nightly-inputs
      script: |
        git config --global http.sslBackend openssl
        git submodule update --init --recursive
        conda init powershell
        powershell -Command "& {
          Set-PSDebug -Trace 1
          \$ErrorActionPreference = 'Stop'
          \$PSNativeCommandUseErrorActionPreference = \$true

          .ci/scripts/setup-windows.ps1 -cpuOnly true
          if (\$LASTEXITCODE -ne 0) {
              exit \$LASTEXITCODE
          }
          python .ci/scripts/test_espressif_idf_configure.py --inputs \$env:RUNNER_ARTIFACT_DIR --work-dir \$env:RUNNER_TEMP\esp-idf-configure
          if (\$LASTEXITCODE -ne 0) {
              exit \$LASTEXITCODE
          }
        }"
