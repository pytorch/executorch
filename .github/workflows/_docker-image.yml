name: Resolve CI docker image

# linux_job_v3 passes `docker-image` straight to the runner pod's container, which
# is pulled before any step runs, so nothing inside the job can derive it. Callers
# depend on this workflow and name the image as
# ${docker-registry}/ci-image:<name>-${ci-docker-hash}.
#
# Nothing here waits for docker-builds. A commit that changes .ci/docker needs the
# ciflow/docker label to build the images it asks for; without them the pod fails
# to pull and the job has to be re-run once they land.

on:
  workflow_call:
    outputs:
      ci-docker-hash:
        description: Tag suffix shared by every executorch CI image for this commit.
        value: ${{ jobs.resolve.outputs.ci-docker-hash }}
      docker-registry:
        description: |
          Registry and namespace the CI images live in. An output rather than a
          literal at each call site, and not an `env`, which GitHub does not
          allow in a reusable workflow's `with`.
        value: 308535385114.dkr.ecr.us-east-1.amazonaws.com/executorch

permissions:
  contents: read

jobs:
  resolve:
    name: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ci-docker-hash: ${{ steps.hash.outputs.ci-docker-hash }}

    steps:
      - name: Checkout ExecuTorch
        uses: actions/checkout@v4
        with:
          # build-cadence-runner.yml reaches this workflow on pull_request_target,
          # where github.sha is the base branch tip. Resolving the tag from there
          # while the test jobs check out the fork head would test a docker change
          # against the old image.
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.sha || github.sha }}
          # Nothing here runs the checked-out code, only `git rev-parse` over it,
          # but on pull_request_target that code is the fork's and the token is
          # the base repository's, so do not leave one next to the other.
          persist-credentials: false

      - name: Compute the docker tag
        id: hash
        run: |
          set -eu
          # Assigned on its own line: set -e does not catch a failure inside a
          # command substitution, so `echo "x=$(git rev-parse ...)"` would write
          # git's error text as the tag and exit 0.
          CI_DOCKER_HASH="$(git rev-parse HEAD:.ci/docker)"
          echo "ci-docker-hash=${CI_DOCKER_HASH}" >> "$GITHUB_OUTPUT"
