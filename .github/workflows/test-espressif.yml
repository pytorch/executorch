name: Test ESP32-S3 Emulator

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    paths:
      - examples/espressif/**
      - tools/cmake/preset/esp_baremetal.cmake
      - CMakePresets.json
      - .ci/scripts/test_espressif.sh
      - .github/workflows/test-espressif.yml
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-image:
    name: Resolve CI docker image
    uses: ./.github/workflows/_docker-image.yml

  test-esp32s3:
    needs: docker-image
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      runner: mt-l-x86iavx512-8-64
      docker-image: ${{ needs.docker-image.outputs.docker-registry }}/ci-image:executorch-ubuntu-22.04-clang12-${{ needs.docker-image.outputs.ci-docker-hash }}
      submodules: recursive
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: 45
      upload-artifact: test-report-esp32s3
      script: |
        set -euo pipefail
        CONDA_ENV=$(conda env list --json | jq -r '.envs | .[-1]')
        conda activate "${CONDA_ENV}"
        source .ci/scripts/utils.sh
        install_executorch --use-pt-pinned-commit --minimal
        bash .ci/scripts/test_espressif.sh
