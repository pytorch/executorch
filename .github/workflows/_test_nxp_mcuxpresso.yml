name: Test NXP MCUXpresso example

permissions:
  id-token: write
  contents: read

on:
  workflow_call:
    inputs:
      mcuxsdk-manifest-rev:
        description: 'MCUXpresso SDK manifest revision to build against. Defaults to the pinned revision baked into the test script.'
        required: false
        type: string
        default: ''
      timeout:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 90

jobs:
  docker-image:
    name: Resolve CI docker image
    uses: ./.github/workflows/_docker-image.yml

  run:
    needs: docker-image
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      runner: mt-l-x86iavx512-8-64
      docker-image: ${{ needs.docker-image.outputs.docker-registry }}/ci-image:executorch-ubuntu-22.04-arm-sdk-${{ needs.docker-image.outputs.ci-docker-hash }}
      submodules: 'recursive'
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: ${{ inputs.timeout }}
      script: |
        # The generic Linux job chooses to use base env, not the one setup by the image
        CONDA_ENV=$(conda env list --json | jq -r ".envs | .[-1]")
        conda activate "${CONDA_ENV}"

        export MCUXSDK_MANIFEST_REV="${{ inputs.mcuxsdk-manifest-rev }}"
        ./examples/nxp/mcuxpresso/imxrt700/executorch_cifarnet/test_build_from_scratch.sh
