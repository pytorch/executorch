name: Arm trunk suite

on:
  workflow_call:

jobs:
  docker-image:
    name: Resolve CI docker image
    uses: ./.github/workflows/_docker-image.yml

  test-arm-backend-zephyr:
    needs: docker-image
    name: test-arm-backend-zephyr
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        include:
          - { readme: zephyr/samples/hello-executorch/README.md, target: ethos-u55 }
          - { readme: zephyr/samples/hello-executorch/README.md, target: cortex-m55 }
          - { readme: zephyr/samples/hello-executorch/README.md, target: ethos-u85 }
          - { readme: zephyr/samples/mv2-ethosu/README.md, target: ethos-u55 }
          - { readme: zephyr/samples/mv2-ethosu/README.md, target: ethos-u85 }
      fail-fast: false
    with:
      runner: mt-l-x86iavx512-8-64
      docker-image: ${{ needs.docker-image.outputs.docker-registry }}/ci-image:executorch-ubuntu-22.04-zephyr-sdk-${{ needs.docker-image.outputs.ci-docker-hash }}
      submodules: 'recursive'
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: 120
      script: |
        #!/bin/bash

        set -euo pipefail

        # Zephyr requires a Python 3.12 venv; keep this independent of the
        # base image's default ExecuTorch Python environment.
        python3.12 -m venv zephyr_test_venv
        source zephyr_test_venv/bin/activate

        # The Zephyr SDK host tools carry their own runtime. The CI Docker image
        # sets a global LD_LIBRARY_PATH for other jobs, which can make SDK tools
        # pick host libs.
        unset LD_LIBRARY_PATH

        # Test zephyr backend
        .ci/scripts/test_zephyr.sh \
          --targets "${TARGET_LIST:-${{ matrix.target }}}" \
          --zephyr-samples-readme-path "${{ matrix.readme }}"

  test-arm-backend-ethos-u:
    needs: docker-image
    name: test-arm-backend-ethos-u
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        include:
          - test_arm_backend: test_pytest_ops_ethos_u55
          - test_arm_backend: test_pytest_models_ethos_u55
          - test_arm_backend: test_run_ethos_u55
          - test_arm_backend: test_minimal_classic_ml_ethos_u55
          - test_arm_backend: test_pmu_counters_example_ethos_u55
          - test_arm_backend: test_pytest_ops_ethos_u85
          - test_arm_backend: test_pytest_models_ethos_u85
          - test_arm_backend: test_run_ethos_u85
          - test_arm_backend: test_run_ethos_u85_clang
            arm_setup_args: --target-toolchain clang
          - test_arm_backend: test_smaller_stories_llama_tosa
          - test_arm_backend: test_model_smollm2_135M_ethos_u85
          - test_arm_backend: test_runtime_ethos_u
          - test_arm_backend: test_ootb_tests_ethos_u
          - test_arm_backend: test_ootb_tests_tosa
          - test_arm_backend: test_deit_e2e_ethos_u
          - test_arm_backend: test_person_detection_e2e_cortex_m
      fail-fast: false
    with:
      runner: mt-l-x86iavx512-8-64
      docker-image: ${{ needs.docker-image.outputs.docker-registry }}/ci-image:executorch-ubuntu-22.04-arm-sdk-${{ needs.docker-image.outputs.ci-docker-hash }}
      submodules: 'recursive'
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: 120
      script: |
        # The generic Linux job chooses to use base env, not the one setup by the image
        CONDA_ENV=$(conda env list --json | jq -r ".envs | .[-1]")
        conda activate "${CONDA_ENV}"

        source .ci/scripts/utils.sh
        install_executorch "--use-pt-pinned-commit"

        ARM_SETUP_ARGS=(${{ matrix.arm_setup_args }})
        .ci/scripts/setup-arm-baremetal-tools.sh "${ARM_SETUP_ARGS[@]}"

        # Increase number of files user can monitor to bypass buck failures.
        # Hopefully this is high enough for this setup.
        # Node-level, so an unprivileged pod cannot change it.
        sudo sysctl fs.inotify.max_user_watches=1048576 2>/dev/null || true

        ARM_TEST=${{ matrix.test_arm_backend }}

        # Output test report on pytest runs so that github can surface failing tests.
        if [[ -n "${RUNNER_TEST_RESULTS_DIR:-}" ]]; then
              export PYTEST_ADDOPTS="--junit-xml=${RUNNER_TEST_RESULTS_DIR}/${ARM_TEST}.xml ${PYTEST_ADDOPTS:-}"
        fi

        # Test test_arm_backend.sh with test
        backends/arm/test/test_arm_backend.sh "${ARM_TEST}"

  test-arm-backend-vkml:
    needs: docker-image
    name: test-arm-backend-vkml
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        include:
          - test_arm_backend: test_pytest_ops_vkml
          - test_arm_backend: test_pytest_models_vkml
          - test_arm_backend: test_run_vkml
          - test_arm_backend: test_ootb_tests_vgf
          - test_arm_backend: test_runtime_vgf
          - test_arm_backend: test_smaller_stories_llama_vkml
      fail-fast: false
    with:
      runner: mt-l-x86iavx512-8-64
      docker-image: ${{ needs.docker-image.outputs.docker-registry }}/ci-image:executorch-ubuntu-24.04-arm-sdk-${{ needs.docker-image.outputs.ci-docker-hash }}
      submodules: 'recursive'
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: 120
      script: |
        # The generic Linux job chooses to use base env, not the one setup by the image
        CONDA_ENV=$(conda env list --json | jq -r ".envs | .[-1]")
        conda activate "${CONDA_ENV}"
        source .ci/scripts/utils.sh
        install_executorch "--use-pt-pinned-commit"

        .ci/scripts/setup-arm-baremetal-tools.sh --disable-ethos-u-deps --enable-mlsdk-deps --install-mlsdk-deps-with-pip

        # Increase number of files user can monitor to bypass buck failures.
        # Hopefully this is high enough for this setup.
        # Node-level, so an unprivileged pod cannot change it.
        sudo sysctl fs.inotify.max_user_watches=1048576 2>/dev/null || true

        ARM_TEST=${{ matrix.test_arm_backend }}

        # Output test report on pytest runs so that github can surface failing tests.
        if [[ -n "${RUNNER_TEST_RESULTS_DIR:-}" ]]; then
          export PYTEST_ADDOPTS="--junit-xml=${RUNNER_TEST_RESULTS_DIR}/${ARM_TEST}.xml ${PYTEST_ADDOPTS:-}"
        fi

        backends/arm/test/test_arm_backend.sh "${ARM_TEST}"

  test-cortex-m-e2e:
    name: test-cortex-m-e2e
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_test_cortex_m_e2e.yml
    with:
      models: '["mv2", "mv3"]'
      targets: '["cortex-m55", "cortex-m7", "cortex-m0plus"]'

  test-cortex-m-ops:
    name: test-cortex-m-ops
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_test_cortex_m_ops.yml
    with:
      targets: '["cortex-m7", "cortex-m0plus"]'
